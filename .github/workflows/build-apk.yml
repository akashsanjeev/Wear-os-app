name: Build Wear OS ANCS Bridge APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Pre-Installed Android SDK (API 34)
        run: |
          SDK_MGR=$(find "$ANDROID_HOME" -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDK_MGR"
          yes | "$SDK_MGR" --licenses > /dev/null || true
          "$SDK_MGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK with Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
          unzip -q /tmp/gradle-8.7.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk OP2R-iOS-Bridge-WearOS5.apk
          ls -lh OP2R-iOS-Bridge-WearOS5.apk

      - name: Upload Compiled Wear OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: op2r-ios-ancs-bridge-debug-apk
          path: |
            OP2R-iOS-Bridge-WearOS5.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct Download APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk \
            OP2R-iOS-Bridge-WearOS5.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "OP2R-Bridge Wear OS 5.0 APK (Latest Build)" \
            --notes "Automated Wear OS 5.0 (API 34) APK build for OnePlus Watch 2R (OPWWE234). Click OP2R-iOS-Bridge-WearOS5.apk under Assets below for direct 1-click download."
